---
Name: silvershop-decimal-quantity
After:
  - silvershop
---
# Per-product decimal quantities. The extensions are inert on a product until its QuantityIsDecimal flag
# is set, so applying them shop-wide is safe. Stock integration is a separate guarded document (added in
# Phase 3, gated on moduleexists: 'silvershop/stock').
SilverShop\Page\Product:
  extensions:
    - SilverShop\DecimalQuantity\Extension\ProductDecimalQuantityExtension

SilverShop\Model\Variation\Variation:
  extensions:
    - SilverShop\DecimalQuantity\Extension\VariationDecimalQuantityExtension

SilverShop\Model\OrderItem:
  extensions:
    - SilverShop\DecimalQuantity\Extension\OrderItemDecimalQuantityExtension

SilverShop\Model\Order:
  extensions:
    - SilverShop\DecimalQuantity\Extension\OrderDecimalQuantityExtension

---
Name: silvershop-decimal-quantity-storefront
After:
  - '#silvershop-decimal-quantity'
---
# Storefront: the decimal cart-line widget (falls back to the integer widget for non-decimal lines).
SilverStripe\Core\Injector\Injector:
  SilverShop\Forms\ShopQuantityField:
    class: SilverShop\DecimalQuantity\Form\DecimalShopQuantityField

---
Name: silvershop-decimal-quantity-routes
After:
  - '#silvershop-routes'
---
# Dedicated Director route for the decimal cart endpoint. A standalone controller (not a CartPageController
# action) because core's CartPageController::handleRequest() only dispatches the cart methods its own
# directorActionToCartMethod() map knows — an extension-added action is never reached.
SilverStripe\Control\Director:
  rules:
    'decimalcart//$Action/$Buyable/$ID': SilverShop\DecimalQuantity\Control\DecimalCartController

---
Name: silvershop-decimal-quantity-stock
Only:
  moduleexists: 'silvershop/stock'
After:
  - '#silvershop-decimal-quantity'
---
# Swap the core stock extension for the decimal-aware subclass (only when silvershop/stock is installed).
# The subclass inherits all stock behaviour and only changes the write path for decimal buyables.
SilverStripe\Core\Injector\Injector:
  SilverShop\Stock\Extensions\ProductStockExtension:
    class: SilverShop\DecimalQuantity\Extension\DecimalProductStockExtension

---
Name: silvershop-decimal-quantity-api
Only:
  moduleexists: 'silvershop-suite/api'
After:
  - '#silvershop-decimal-quantity'
---
# REST + GraphQL output carries the decimal quantity (api-graphql reuses the base serializers).
SilverShop\Api\Serializer\OrderSerializer:
  extensions:
    - SilverShop\DecimalQuantity\Extension\OrderSerializerDecimalExtension
